<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="43%" r="68%">
      <stop offset="0" stop-color="#F4EFFC"/>
      <stop offset=".48" stop-color="#EAE3F7"/>
      <stop offset="1" stop-color="#DCD2EF"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8A5CFF" stop-opacity=".22"/>
      <stop offset=".48" stop-color="#6C4DFB" stop-opacity=".10"/>
      <stop offset="1" stop-color="#6C4DFB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftFlow" x1="168" y1="600" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A21FE0" stop-opacity="0"/>
      <stop offset=".55" stop-color="#7B3FE4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4B2BB0"/>
    </linearGradient>
    <linearGradient id="rightFlow" x1="1032" y1="600" x2="600" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FA800" stop-opacity="0"/>
      <stop offset=".55" stop-color="#6E9400" stop-opacity=".85"/>
      <stop offset="1" stop-color="#3F5A00"/>
    </linearGradient>
    <linearGradient id="orbit" x1="252" y1="288" x2="948" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A21FE0" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#6C4DFB" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6E9400" stop-opacity=".28"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="13" r="1" fill="#6C4DFB" opacity=".16"/>
      <circle cx="61" cy="42" r=".8" fill="#6E9400" opacity=".2"/>
      <circle cx="31" cy="83" r=".7" fill="#8A5CFF" opacity=".18"/>
    </pattern>
    <path id="leftTrack" d="M145 600C275 600 300 455 424 483C493 499 524 562 584 600"/>
    <path id="rightTrack" d="M1055 600C925 600 900 455 776 483C707 499 676 562 616 600"/>
    <path id="orbitTrack" d="M600 154A446 446 0 1 1 599.9 154"/>
    <style>
      .slow { animation: drift 208s linear infinite; transform-origin: 600px 600px; }
      .counter { animation: drift 272s linear infinite reverse; transform-origin: 600px 600px; }
      .breathe { animation: breathe 35.2s ease-in-out infinite; transform-origin: 600px 600px; }
      .pulse { animation: pulse 30.4s ease-out infinite; transform-origin: 600px 600px; }
      .twinkle { animation: twinkle 22.4s ease-in-out infinite; }
      .flowA { animation: dash 44s linear infinite; }
      .flowB { animation: dash 51.2s linear infinite reverse; }
      @keyframes drift { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%,100% { opacity:.56; transform:scale(.96); } 50% { opacity:1; transform:scale(1.045); } }
      @keyframes pulse { 0% { opacity:0; transform:scale(.68); } 18% { opacity:.72; } 100% { opacity:0; transform:scale(1.55); } }
      @keyframes twinkle { 0%,100% { opacity:.32; } 50% { opacity:1; } }
      @keyframes dash { to { stroke-dashoffset:-160; } }
      @media (prefers-reduced-motion: reduce) {
        .slow,.counter,.breathe,.pulse,.twinkle,.flowA,.flowB { animation:none !important; }
        .moving-particles { display:none; }
      }
    </style>
  </defs>


  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#grain)" opacity=".34"/>

  <circle cx="600" cy="600" r="398" fill="url(#core)" filter="url(#softGlow)"/>



  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#leftTrack" stroke="#A21FE0" stroke-opacity=".12" stroke-width="26" filter="url(#softGlow)"/>
    <use href="#leftTrack" stroke="url(#leftFlow)" stroke-width="2.2"/>
    <use href="#leftTrack" stroke="#4B2BB0" stroke-opacity=".52" stroke-width="1.2" stroke-dasharray="2 18"/>
    <use href="#rightTrack" stroke="#6E9400" stroke-opacity=".13" stroke-width="26" filter="url(#softGlow)"/>
    <use href="#rightTrack" stroke="url(#rightFlow)" stroke-width="2.2"/>
    <use href="#rightTrack" stroke="#4B2BB0" stroke-opacity=".48" stroke-width="1.2" stroke-dasharray="2 18"/>
  </g>

  <g fill="#F5F1FB" stroke="#6C4DFB" stroke-width="1.5">
    <circle cx="145" cy="600" r="25"/><circle cx="279" cy="469" r="14"/><circle cx="280" cy="730" r="14"/>
    <circle cx="424" cy="483" r="10"/><circle cx="424" cy="717" r="10"/>
  </g>
  <g fill="#A21FE0" filter="url(#glow)">
    <circle cx="145" cy="600" r="5"/><circle cx="279" cy="469" r="3.5"/><circle cx="280" cy="730" r="3.5"/>
    <circle cx="424" cy="483" r="2.5"/><circle cx="424" cy="717" r="2.5"/>
  </g>
  <g fill="#F5F1FB" stroke="#6E9400" stroke-width="1.5">
    <circle cx="1055" cy="600" r="25"/><circle cx="921" cy="469" r="14"/><circle cx="920" cy="730" r="14"/>
    <circle cx="776" cy="483" r="10"/><circle cx="776" cy="717" r="10"/>
  </g>
  <g fill="#6E9400" filter="url(#glow)">
    <circle cx="1055" cy="600" r="5"/><circle cx="921" cy="469" r="3.5"/><circle cx="920" cy="730" r="3.5"/>
    <circle cx="776" cy="483" r="2.5"/><circle cx="776" cy="717" r="2.5"/>
  </g>


  <circle cx="600" cy="600" r="154" stroke="#6C4DFB" stroke-opacity=".18" stroke-width="1"/>
  <circle cx="600" cy="600" r="141" stroke="#6E9400" stroke-opacity=".2" stroke-width="1" stroke-dasharray="1 8"/>

</svg>
